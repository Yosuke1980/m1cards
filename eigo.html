// ---- サウンド（さんすうカードと同じ自作効果音・外部音源なし） ----
let sndOn = true;
try{ sndOn = localStorage.getItem('eigo-sound') !== 'off'; }catch(e){}
let ac = null;
function actx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!ac) ac = new AC();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function envGain(g, t0, peak, dur){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
}
function noiseBuf(){
  if(noiseBuf.b) return noiseBuf.b;
  const c = actx(), b = c.createBuffer(1, c.sampleRate*0.5, c.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf.b = b;
}
let masterNode = null;
function makeIR(dur, decay){
  const c = actx(), len = Math.floor(c.sampleRate*dur);
  const b = c.createBuffer(2, len, c.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = b.getChannelData(ch);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
  }
  return b;
}
function master(){
  const c = actx();
  if(!masterNode){
    const inp = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 6;
    comp.connect(c.destination);
    inp.connect(comp);
    const conv = c.createConvolver(); conv.buffer = makeIR(1.8, 2.5);
    const wet = c.createGain(); wet.gain.value = 0.35;
    inp.connect(conv); conv.connect(wet); wet.connect(comp);
    masterNode = inp;
  }
  return masterNode;
}
function playNoise(t0, dur, freq, peak){
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function tone(t0, freq, dur, type, peak, slideTo){
  const c = actx();
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  const g = c.createGain(); envGain(g, t0, peak, dur);
  o.connect(g); g.connect(master());
  o.start(t0); o.stop(t0+dur+0.05);
}
function sndCrash(t0, dur, peak){
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function sndKaboom(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 90, 0.8, 'sine', 0.9, 28);
  playNoise(t0, 0.25, 250, 0.5);
  sndCrash(t0, 1.4, 0.3);
}
function sndZuban(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 500, 0.45, 'sawtooth', 0.3, 60);
  tone(t0+0.05, 70, 0.6, 'sine', 0.6, 30);
}
function sndDon(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 82, 0.55, 'sine', 0.7, 32);
  playNoise(t0, 0.12, 180, 0.25);
}
const sndBtn = document.getElementById('snd-btn');
function updSndBtn(){ sndBtn.textContent = sndOn ? '🔊' : '🔇'; }
sndBtn.addEventListener('click', ()=>{
  sndOn = !sndOn;
  try{ localStorage.setItem('eigo-sound', sndOn ? 'on' : 'off'); }catch(e){}
  if(sndOn){ actx(); sndDon(); }
  updSndBtn();
});
updSndBtn();

// ---- えいご音声（ブラウザ内蔵の読み上げ・外部音源なし） ----
let enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>v.lang==='en-US' && v.name.includes('Samantha')) ||
            vs.find(v=>v.lang==='en-US') || vs.find(v=>v.lang.startsWith('en')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let enBank = {};
fetch('audio/en/manifest.json').then(r=>r.json()).then(m=>{ enBank = m; }).catch(()=>{});
let curAudio = null;
function stopAudio(){
  if(curAudio){ curAudio.pause(); curAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speakTTS(text){
  if(!('speechSynthesis' in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if(enVoice) u.voice = enVoice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}
function speak(text){
  if(!text) return;
  stopAudio();
  if(enBank[text]){
    curAudio = new Audio('audio/en/' + enBank[text]);
    curAudio.play().catch(()=>speakTTS(text));
    return;
  }
  speakTTS(text);
}
document.getElementById('card').addEventListener('click', ()=>{
  if(cur && cur.en) speak(cur.en);
});

const $ = id => document.getElementById(id);
let cat = 'all';
let pool = [], idx = 0, qNo = 0, score = 0, streak = 0;
let cur = null, locked = false;

let againPool = [];
try{
  const s = localStorage.getItem('eigo-again');
  if(s) againPool = JSON.parse(s);
}catch(e){}
function saveAgain(){ try{ localStorage.setItem('eigo-again', JSON.stringify(againPool.slice(0,60))); }catch(e){} }

function buildPool(){
  pool = DECK.map((_,i)=>i).filter(i => cat==='all' || DECK[i].c===cat);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  idx = 0;
}

function pick(){
  if(againPool.length && Math.random() < 0.35){
    const cand = againPool.filter(i => cat==='all' || DECK[i].c===cat);
    if(cand.length) return {i:cand[Math.floor(Math.random()*cand.length)], again:true};
  }
  const i = pool[idx % pool.length];
  idx++;
  if(idx >= pool.length) buildPool();
  return {i, again:false};
}

function ghMini(){ $('gh-mini').textContent = GOHOUBI.mini(); }

function render(){
  const p = pick();
  cur = {...DECK[p.i], i:p.i, again:p.again};
  locked = false; qNo++;
  $('counter').textContent = 'もんだい ' + qNo;
  $('score').innerHTML = 'せいかい ' + score + ' / ' + (qNo-1) +
    (streak>=2 ? '　<span style="color:#f0857c;">🔥' + streak + 'れんぞく</span>' : '');
  ghMini();
  $('cat-badge').textContent = cur.c;
  $('q-text').innerHTML = cur.q;
  $('card-note').textContent = cur.en ? '🔊カードをタップすると もういちど きけるよ' : 'したの4つからえらんでね';
  $('card').classList.toggle('is-again', cur.again);
  if(cur.en) setTimeout(()=>speak(cur.en), 400);
  const opts = [cur.a, ...cur.alt];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const el = $('choices');
  el.innerHTML = '';
  opts.forEach(v=>{
    const b = document.createElement('button');
    b.dataset.v = v;
    if(/^[A-Za-z0-9 .,'!?\u25CB-]+$/.test(v)){
      const sp = document.createElement('span');
      sp.textContent = '\uD83D\uDD0A ';
      sp.style.cssText = 'opacity:.85;';
      sp.addEventListener('click', ev=>{
        ev.stopPropagation();
        speak(v.replace(/\u25CB\u25CB/g, '').trim());
      });
      b.appendChild(sp);
      b.appendChild(document.createTextNode(v));
    }else{
      b.textContent = v;
    }
    b.addEventListener('click', ()=>answer(b, v===cur.a));
    el.appendChild(b);
  });
}

function confetti(n){
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.style.cssText = 'position:fixed;top:-16px;z-index:30;pointer-events:none;border-radius:2px;';
    s.style.background = Math.random()<.65 ? 'var(--gold)' : 'var(--red)';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.width = (5+Math.random()*6) + 'px';
    s.style.height = (10+Math.random()*12) + 'px';
    s.style.animation = 'ghFall ' + (1.2+Math.random()*1.3) + 's linear ' + (Math.random()*.3) + 's forwards';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 3200);
  }
}

function answer(btn, ok){
  if(locked) return;
  locked = true;
  [...$('choices').children].forEach(b=>{
    b.disabled = true;
    if((b.dataset.v || b.textContent) === cur.a) b.classList.add('correct');
  });
  if(ok){
    score++; streak++;
    sndKaboom();
    $('card').classList.add('flash');
    setTimeout(()=>$('card').classList.remove('flash'), 550);
    $('card-note').textContent = streak>=3 ? '🔥 ' + streak + 'れんぞくせいかい！' : 'せいかい！🎉';
    if(streak>=3){ confetti(streak>=5 ? 26 : 14); sndDon(); }
    if(cur.ena) setTimeout(()=>speak(cur.ena), 500);
    const ai = againPool.indexOf(cur.i);
    if(ai>=0){ againPool.splice(ai,1); saveAgain(); }
    const shown = GOHOUBI.award(()=>{ ghMini(); render(); }, 800);
    ghMini();
    if(!shown) setTimeout(render, 950);
  }else{
    streak = 0;
    GOHOUBI.miss(); ghMini();
    sndZuban();
    if(btn) btn.classList.add('wrong');
    $('card').classList.add('shake');
    setTimeout(()=>$('card').classList.remove('shake'), 500);
    $('card-note').innerHTML = 'こたえは <span class="ans">' + cur.a + '</span>！⭐は0から。あとでもういっかい出すよ💪';
    if(!againPool.includes(cur.i)){ againPool.unshift(cur.i); saveAgain(); }
    const b = document.createElement('button');
    b.className = 'next-q';
    b.textContent = 'つぎのもんだいへ →';
    b.addEventListener('click', render);
    $('choices').appendChild(b);
  }
}

document.querySelectorAll('#cat-filters button').forEach(b=>{
  b.addEventListener('click', ()=>{
    cat = b.dataset.c;
    document.querySelectorAll('#cat-filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    buildPool(); render();
  });
});

buildPool();
render();
</script>
