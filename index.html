<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>M-1グランプリ いちもんいっとうカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111013;
  --panel:#1c1a1f;
  --panel-2:#242127;
  --line:#38343d;
  --red:#d1352b;
  --red-deep:#8f1f18;
  --gold:#d9a441;
  --text:#f2efe9;
  --text-dim:#a49e94;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,.card{touch-action:manipulation;}
body{
  background:
    radial-gradient(ellipse 90% 55% at 50% -10%, rgba(209,53,43,.20), transparent 60%),
    radial-gradient(ellipse 45% 35% at 15% 110%, rgba(217,164,65,.10), transparent 60%),
    radial-gradient(ellipse 45% 35% at 85% 110%, rgba(217,164,65,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:"Zen Maru Gothic",sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 64px;
}
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background:
    linear-gradient(115deg, transparent 38%, rgba(242,239,233,.035) 45%, transparent 52%),
    linear-gradient(63deg, transparent 52%, rgba(242,239,233,.03) 60%, transparent 68%);
}
body>*{position:relative;z-index:1;}
ruby{ruby-align:center;}
rt{
  font-size:0.45em;
  font-weight:400;
  color:inherit;
  opacity:0.85;
  letter-spacing:0;
}
header{width:100%;max-width:740px;margin-bottom:28px;}
.eyebrow{
  font-size:12px;
  letter-spacing:0.3em;
  color:var(--gold);
  font-weight:700;
  margin-bottom:6px;
}
h1{
  font-size:26px;
  font-weight:900;
  letter-spacing:0.02em;
  border-left:6px solid var(--red);
  padding-left:14px;
  line-height:1.6;
}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--text-dim);margin-top:6px;letter-spacing:0.05em;line-height:2;}
.nav{width:100%;max-width:740px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.nav a,.nav span{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap;}
.nav span{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700;}
.mode-toggle{
  width:100%;
  max-width:740px;
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.mode-toggle button{
  flex:1;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text-dim);
  cursor:pointer;
  transition:all .15s;
  line-height:1.6;
}
.mode-toggle button.active{background:var(--gold);border-color:var(--gold);color:#1a1408;}
.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
  max-width:740px;
  margin-bottom:20px;
}
.filters button{
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  padding:10px 20px;
  background:var(--panel);
  color:var(--text-dim);
  border:1px solid var(--line);
  border-radius:999px;
  cursor:pointer;
  transition:all .15s;
  line-height:1.6;
}
@media (hover:hover){.filters button:hover{border-color:var(--red);color:var(--text);}}
.filters button.active{background:var(--red);border-color:var(--red);color:#fff;}
.status{
  width:100%;
  max-width:740px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:13px;
  color:var(--text-dim);
}
.status .learned-count{color:var(--gold);font-weight:700;}
.badge{
  display:inline-block;
  font-size:13px;
  font-weight:700;
  padding:5px 16px;
  border-radius:4px;
  background:var(--red-deep);
  color:#fff;
  letter-spacing:0.05em;
  line-height:1.8;
}
.status .snd{
  font-family:inherit;
  font-size:14px;
  padding:4px 9px;
  margin-right:6px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  cursor:pointer;
}
.card{
  width:100%;
  max-width:740px;
  min-height:320px;
  background:var(--panel);
  border:1px solid var(--line);
  border-top:4px solid var(--red);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:48px 32px;
  cursor:pointer;
  position:relative;
  user-select:none;
  transition:border-color .15s;
  box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);
  overflow:hidden;
}
.card.flash{animation:flashGold .5s;}
@keyframes flashGold{
  0%{box-shadow:0 0 0 3px var(--gold), 0 0 70px rgba(217,164,65,.85);}
  100%{box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);}
}
@media (hover:hover){.card:hover{border-color:var(--red);border-top-color:var(--red);}}
.card.answer{border-top-color:var(--gold);background:var(--panel-2);}
.side-label{
  font-size:14px;
  letter-spacing:0.2em;
  font-weight:700;
  color:var(--text-dim);
  margin-bottom:20px;
}
.card.answer .side-label{color:var(--gold);}
.card-text{
  font-size:26px;
  font-weight:700;
  line-height:2.3;
  max-width:640px;
}
.card.answer .card-text{color:var(--gold);font-weight:900;font-size:30px;}
.card-note{font-size:13px;color:var(--text-dim);margin-top:26px;line-height:1.8;}
.learned-tag{
  position:absolute;
  top:14px;
  right:16px;
  font-size:12px;
  font-weight:700;
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:3px 10px;
  display:none;
}
.card.is-learned .learned-tag{display:block;}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:22px;
  width:100%;
  max-width:740px;
}
.controls button{
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  padding:14px 24px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
}
.controls button.primary{background:var(--red);border-color:var(--red);color:#fff;}
.controls button.gold{border-color:var(--gold);color:var(--gold);}
.controls button.fight{border-color:#e2483d;color:#f0857c;}
@media (hover:hover){
  .controls button:hover{border-color:var(--text-dim);background:var(--panel-2);}
  .controls button.primary:hover{background:#e2483d;}
  .controls button.gold:hover{background:var(--gold);color:#1a1408;}
  .controls button.fight:hover{background:var(--red);color:#fff;}
}
.hard-tag{
  position:absolute;
  top:14px;
  left:16px;
  font-size:12px;
  font-weight:700;
  color:#f0857c;
  border:1px solid #e2483d;
  border-radius:4px;
  padding:3px 10px;
  display:none;
}
.card.is-hard .hard-tag{display:block;}
.choices{
  display:none;
  width:100%;
  max-width:740px;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
body.quiz-mode .choices{display:grid;}
body.quiz-mode .controls,
body.quiz-mode .help{display:none;}
body.quiz-mode .card{min-height:200px;cursor:default;}
.choices button{
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  line-height:1.9;
  padding:16px 14px;
  border-radius:6px;
  border:1px solid var(--line);
  border-left:5px solid var(--gold);
  background:linear-gradient(180deg,#242127,#191619);
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  text-align:left;
}
@media (hover:hover){.choices button:hover:not(:disabled){border-color:var(--red);}}
.choices button.correct{background:#2f7d4a;border-color:#2f7d4a;color:#fff;}
.choices button.next-q{
  grid-column:1/-1;
  border-color:var(--red);
  border-left:5px solid var(--red);
  background:var(--red);
  color:#fff;
  text-align:center;
}
@media (hover:hover){.choices button.next-q:hover:not(:disabled){background:#e2483d;border-color:#e2483d;}}
.choices button.wrong{background:var(--red-deep);border-color:var(--red-deep);color:#fff;}
.choices button.giveup{
  grid-column:1/-1;
  background:transparent;border:1px dashed #55505c;color:#8f8a96;
  font-size:13px;padding:9px 12px;
}
@media (hover:hover){.choices button.giveup:hover:not(:disabled){border-color:#8f8a96;color:#c9c4d0;}}
.choices button:disabled{cursor:default;}
.confetti{
  position:fixed;top:-16px;z-index:30;
  pointer-events:none;border-radius:2px;
  animation:confFall linear forwards;
}
@keyframes confFall{
  to{transform:translateY(108vh) rotate(720deg);opacity:.85;}
}
.votes{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  max-width:560px;margin:0 auto;
}
.vote-panel{width:96px;height:64px;perspective:420px;display:block;}
.vp-inner{
  position:relative;display:block;width:100%;height:100%;
  transform-style:preserve-3d;transform:rotateY(0);
  animation:vpFlip .55s ease forwards;
}
@keyframes vpFlip{to{transform:rotateY(180deg);}}
.vp-front,.vp-back{
  position:absolute;inset:0;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-weight:900;
}
.vp-front{
  background:linear-gradient(180deg,#2a262e,#1b191e);
  border:1px solid var(--line);
  color:var(--text-dim);font-size:22px;
}
.vp-back{
  transform:rotateY(180deg);
  font-size:12px;line-height:1.5;text-align:center;padding:4px;
  background:#221f25;border:1px solid var(--line);color:var(--text);
}
.vote-panel.win .vp-back{
  background:linear-gradient(180deg,#3a2f14,#241c0c);
  border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 12px rgba(217,164,65,.4);
}
.votes-sum{
  display:block;font-size:13px;font-weight:400;
  color:var(--text-dim);margin-top:16px;line-height:2;
}
.emikuji-overlay{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;
  background:rgba(17,16,19,.92);
}
.emi-wrap{position:relative;width:200px;height:240px;}
.emi-box{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:180px;height:80px;
  background:linear-gradient(180deg,#5c3a1e,#3a2412);
  border:2px solid #7a5327;border-radius:8px 8px 4px 4px;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
  animation:emiShake .35s ease 3;
}
.emi-box::before{
  content:"えみくじ";
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:900;color:var(--gold);letter-spacing:.2em;white-space:nowrap;
}
@keyframes emiShake{
  0%,100%{transform:translateX(-50%);}
  25%{transform:translateX(calc(-50% - 5px)) rotate(-1.5deg);}
  75%{transform:translateX(calc(-50% + 5px)) rotate(1.5deg);}
}
.emi-stick{
  position:absolute;bottom:62px;left:50%;
  width:48px;height:160px;margin-left:-24px;
  perspective:500px;
  animation:emiRise .5s 1.05s cubic-bezier(.2,1.3,.5,1) both;
}
@keyframes emiRise{
  0%{transform:translateY(130px);opacity:0;}
  40%{opacity:1;}
  100%{transform:translateY(0);opacity:1;}
}
.emi-inner{
  position:relative;display:block;width:100%;height:100%;
  transform-style:preserve-3d;
  animation:emiFlip .45s 1.6s ease forwards;
}
@keyframes emiFlip{to{transform:rotateY(180deg);}}
.emi-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;
  font-weight:900;letter-spacing:.15em;
}
.emi-face ruby{writing-mode:vertical-rl;}
.emi-front{
  background:linear-gradient(180deg,#d1352b,#8f1f18);
  border:2px solid var(--gold);color:#fff;font-size:16px;
}
.emi-back{
  transform:rotateY(180deg);
  background:linear-gradient(180deg,#2c2830,#1b191e);
  border:2px solid var(--gold);color:var(--gold);font-size:15px;
}
.emikuji-overlay.win .emi-back{
  background:linear-gradient(180deg,#e8b856,#a87b28);
  border-color:#fff0d0;color:#571510;font-size:17px;
  box-shadow:0 0 28px rgba(217,164,65,.75);
}
.emikuji-overlay.lose .emi-back{
  background:linear-gradient(180deg,#3a3a42,#232329);
  border-color:#5a5a64;color:#a49e94;
  box-shadow:none;
}
.emi-caption{
  position:absolute;bottom:-38px;width:100%;
  text-align:center;font-size:17px;font-weight:900;color:#f0857c;
  animation:fadeIn .3s .9s both;
}
@keyframes fadeIn{to{opacity:1;}from{opacity:0;}}
.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
.uta,.zukan{display:none;width:100%;max-width:740px;}
body.uta-mode .uta{display:block;}
body.zukan-mode .zukan{display:block;}
body.uta-mode .card,body.uta-mode .choices,body.uta-mode .controls,body.uta-mode .status,body.uta-mode .filters,body.uta-mode .progress-bar,body.uta-mode .help,
body.zukan-mode .card,body.zukan-mode .choices,body.zukan-mode .controls,body.zukan-mode .status,body.zukan-mode .filters,body.zukan-mode .progress-bar,body.zukan-mode .help{display:none;}
.uta-panel{
  background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);
  border-radius:12px;padding:22px 18px 30px;
  box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);
}
.uta-title{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:4px;text-align:center;letter-spacing:.1em;}
.uta-sub{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:14px;line-height:1.8;}
.uta-play{
  display:block;margin:0 auto 16px;font-family:inherit;font-size:15px;font-weight:700;
  padding:12px 28px;border-radius:999px;border:1px solid var(--gold);
  background:transparent;color:var(--gold);cursor:pointer;transition:all .15s;
}
.uta-play.playing{background:var(--red);border-color:var(--red);color:#fff;}
@media (hover:hover){.uta-play:hover{background:var(--gold);color:#1a1408;}}
.uta-line{
  display:flex;align-items:baseline;gap:12px;
  padding:9px 14px;border-radius:8px;cursor:pointer;
  font-size:19px;font-weight:700;line-height:1.9;transition:background .15s;
}
@media (hover:hover){.uta-line:hover{background:var(--panel-2);}}
.uta-line .u-y{flex:0 0 92px;color:var(--red);font-weight:900;text-align:right;font-size:17px;}
.uta-line.now{background:linear-gradient(90deg,rgba(217,164,65,.25),transparent);}
.uta-line.now .u-y{color:var(--gold);}
.uta-head{
  font-size:13px;font-weight:700;color:var(--text-dim);letter-spacing:.15em;
  margin:14px 0 4px;padding:0 14px;cursor:default;
}
.zk-intro{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px;margin-bottom:12px;font-size:13px;color:var(--text-dim);line-height:2;
}
.zk-intro strong{color:var(--gold);}
details.zk-year{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:8px;overflow:hidden;
}
details.zk-year summary{
  list-style:none;cursor:pointer;padding:13px 16px;
  font-size:16px;font-weight:700;line-height:1.9;
  display:flex;align-items:baseline;gap:10px;
}
details.zk-year summary::-webkit-details-marker{display:none;}
details.zk-year summary .zk-y{flex:0 0 auto;color:var(--red);font-weight:900;}
details.zk-year summary .zk-k{flex:0 0 auto;font-size:12px;color:var(--text-dim);}
details.zk-year[open]{border-color:var(--gold);}
details.zk-year[open] summary{border-bottom:1px solid var(--line);background:var(--panel-2);}
.zk-body{padding:13px 16px 15px;font-size:14px;line-height:2.1;}
.zk-body .zk-row{margin-bottom:4px;}
.zk-body .zk-label{
  display:inline-block;font-size:11px;font-weight:700;color:var(--gold);
  border:1px solid rgba(217,164,65,.5);border-radius:4px;padding:0 7px;margin-right:8px;
  vertical-align:1px;letter-spacing:.05em;
}
.zk-judges{font-size:13px;color:var(--text-dim);line-height:2;}
@media (max-width:560px){
  .mode-toggle button{padding:9px 4px;font-size:12px;}
  body.uta-mode,body.zukan-mode{padding-bottom:32px;}
  .uta-line{font-size:16px;padding:8px 10px;gap:8px;}
  .uta-line .u-y{flex:0 0 76px;font-size:14px;}
  details.zk-year summary{font-size:14px;padding:11px 12px;}
  .zk-body{font-size:13px;}
}
.progress-bar{
  width:100%;
  max-width:740px;
  height:5px;
  background:var(--line);
  border-radius:3px;
  margin-top:26px;
  overflow:hidden;
}
.progress-bar div{height:100%;background:var(--red);width:0;transition:width .2s;}
.help{
  margin-top:18px;
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.05em;
}
.help kbd{
  font-family:inherit;
  border:1px solid var(--line);
  border-radius:3px;
  padding:1px 7px;
  margin:0 2px;
  background:var(--panel);
}
@media (min-width:561px) and (max-width:1080px) and (pointer:coarse){
  .filters button{padding:12px 22px;font-size:15px;}
  .controls button{padding:17px 26px;font-size:16px;border-radius:10px;}
  .card{min-height:380px;}
  .card-text{font-size:30px;}
  .card.answer .card-text{font-size:34px;}
  .choices button{padding:20px 16px;font-size:17px;}
  .help{display:none;}
}
@media (max-width:560px){
  body{padding:10px 12px calc(180px + env(safe-area-inset-bottom));}
  header{margin-bottom:8px;}
  h1{font-size:17px;}
  h1 small{display:none;}
  .eyebrow{margin-bottom:3px;}
  .mode-toggle{margin-bottom:8px;}
  .mode-toggle button{padding:9px;font-size:13px;}
  .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:8px;padding-bottom:4px;}
  .filters::-webkit-scrollbar{display:none;}
  .filters button{flex:0 0 auto;padding:9px 15px;font-size:13px;}
  .status{margin-bottom:6px;font-size:12px;}
  .card-text{font-size:20px;}
  .card.answer .card-text{font-size:24px;}
  .card{padding:28px 16px;min-height:240px;}
  .card-note{margin-top:14px;}
  .controls{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    max-width:none;margin-top:0;
    background:rgba(17,16,19,.97);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;
  }
  .controls button{padding:14px 4px;font-size:14px;border-radius:10px;}
  .controls button.primary{font-size:16px;}
  .controls button:last-child{grid-column:1 / -1;padding:7px;font-size:12px;color:var(--text-dim);background:transparent;border-color:transparent;}
  .progress-bar{margin-top:10px;}
  .help{display:none;}
  .choices{grid-template-columns:1fr;gap:7px;margin-top:10px;}
  .choices button{padding:13px 12px;font-size:14px;}
  body.quiz-mode{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
  body.quiz-mode .card{min-height:150px;padding:20px 14px;}
  body.quiz-mode .card-text{font-size:18px;line-height:2;}
  body.quiz-mode .card.answer .card-text{font-size:21px;}
  body.quiz-mode .card-note{margin-top:10px;font-size:12px;}
  body.quiz-mode .choices button{padding:11px 12px;font-size:13px;line-height:1.7;}
  body.quiz-mode .choices button.next-q{

function normName(s){
  return s.replace(/\[[^\]]*\]/g,'').replace(/[(（][^)）]*[)）]/g,'').trim();
}
const judgeIndex = {};
Object.keys(judges).forEach(y=>{
  judgeIndex[y] = judges[y].split("\n").map(f=>({full:f, key:normName(f)}));
});
const judgeByKey = {};
Object.values(judgeIndex).forEach(list=>{
  list.forEach(j=>{ if(!judgeByKey[j.key]) judgeByKey[j.key] = j.full; });
});
function pickRandom(arr, n){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0, n);
}
years.forEach(d=>{
  const list = judgeIndex[d.y];
  if(!list) return;
  const inKeys = new Set(list.map(j=>j.key));
  const outsiders = Object.keys(judgeByKey).filter(k=>!inKeys.has(k));
  if(outsiders.length < 3) return;
  const panelNote = `💡 ${d.y}年[ねん]の審査員[しんさいん](${list.length}人[にん]): ` + list.map(j=>j.full).join('、');
  const correct = list[Math.floor(Math.random()*list.length)];
  cards.push({
    c:"審査員",
    q:`${d.y}年[ねん]の審査員[しんさいん]にいたのはだれ?`,
    a:correct.full,
    alt:pickRandom(outsiders, 3).map(k=>judgeByKey[k]),
    panel:{y:d.y, list}, hl:correct.key,
    note:panelNote
  });
  const outKey = pickRandom(outsiders, 1)[0];
  cards.push({
    c:"審査員",
    q:`${d.y}年[ねん]の審査員[しんさいん]じゃないのはだれ?`,
    a:judgeByKey[outKey],
    alt:pickRandom(list, 3).map(j=>j.full),
    panel:{y:d.y, list}, hl:null,
    note:panelNote
  });
});

function rubyfy(s){
  return s
    .replace(/([\u4E00-\u9FFF\u3400-\u4DBF々〆]+)\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/([A-Za-z][A-Za-z0-9 .&'\-]*)\[([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/\n/g, '<br>');
}

function buildPool(){
  pool = cards.map((_,i)=>i).filter(i=>{
    if(mode==='quiz' && cards[i].noQuiz) return false;
    if(filter==='all') return true;
    if(filter==='unlearned') return !learned.has(i);
    if(filter==='hard') return hard.has(i);
    return cards[i].c===filter;
  });
  if(pool.length===0) pool = cards.map((_,i)=>i).filter(i=>mode!=='quiz'||!cards[i].noQuiz);
  for(let i=pool.length-1;i>0;i--){

let sndOn = true;
try{ sndOn = localStorage.getItem('m1-sound') !== 'off'; }catch(e){}
let ac = null;
function actx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!ac) ac = new AC();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function envGain(g, t0, peak, dur){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
}
function noiseBuf(){
  if(noiseBuf.b) return noiseBuf.b;
  const c = actx(), b = c.createBuffer(1, c.sampleRate*0.5, c.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf.b = b;
}
let masterNode = null;
function makeIR(dur, decay){ // ホール残響のインパルス応答を合成
  const c = actx(), len = Math.floor(c.sampleRate*dur);
  const b = c.createBuffer(2, len, c.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = b.getChannelData(ch);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
  }
  return b;
}
function master(){
  const c = actx();
  if(!masterNode){
    const inp = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 6;
    comp.connect(c.destination);
    inp.connect(comp); // ドライ
    const conv = c.createConvolver(); conv.buffer = makeIR(1.8, 2.5);
    const wet = c.createGain(); wet.gain.value = 0.35;
    inp.connect(conv); conv.connect(wet); wet.connect(comp); // リバーブ
    masterNode = inp;
  }
  return masterNode;
}
function playNoise(t0, dur, freq, peak){
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function tone(t0, freq, dur, type, peak, slideTo){
  const c = actx();
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  const g = c.createGain(); envGain(g, t0, peak, dur);
  o.connect(g); g.connect(master());
  o.start(t0); o.stop(t0+dur+0.05);
}
function sndCrash(t0, dur, peak){ // シンバル「シャーン」の余韻
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function sndKaboom(delay){ // どカーン!
  if(!sndOn) return;
  const t0 = actx().currentTime + (delay||0);
  tone(t0, 90, 0.8, 'sine', 0.9, 28);
  playNoise(t0, 0.25, 250, 0.5);
  sndCrash(t0, 1.4, 0.3);
}
function sndZuban(delay){ // ずばーん!(ざんねん)
  if(!sndOn) return;
  const t0 = actx().currentTime + (delay||0);
  tone(t0, 500, 0.45, 'sawtooth', 0.3, 60);
  playNoise(t0, 0.2, 400, 0.4);
  tone(t0+0.05, 70, 0.6, 'sine', 0.6, 30);
  sndCrash(t0, 0.8, 0.18);
}
function sndShake(){ // くじ箱を振る「ジャッ…ジャッ…」（箱の揺れと同期）
  if(!sndOn) return;
  const t0 = actx().currentTime;
  for(let i=0;i<3;i++){
    const t = t0 + i*0.35;
    playNoise(t+0.09, 0.07, 2400, 0.3);
    tone(t+0.09, 180, 0.05, 'triangle', 0.09);
    playNoise(t+0.26, 0.09, 1900, 0.36);
    tone(t+0.26, 150, 0.06, 'triangle', 0.11);
  }
}
function sndDon(delay){ // 太鼓ドン（低く重く）
  if(!sndOn) return;
  const t0 = actx().currentTime + (delay||0);
  tone(t0, 82, 0.55, 'sine', 0.7, 32);
  playNoise(t0, 0.12, 180, 0.25);
}

  $('progress').style.width = ((idx+1)/pool.length*100) + '%';
  buildChoices(c);
}

function similarType(a,b){
  const sig = s => [
    /^\d{4}年/.test(s),
    s.includes('年[ねん]'),
    s.startsWith('第'),
    s.includes('票[ひょう]'),
    s.includes('番[ばん]')
  ].join();
  return sig(a)===sig(b);
}

function choiceLabel(a){ // 補足の括弧行は選択肢ボタンでは隠す（答えバレ防止）
  const i = a.indexOf('\n');
  if(i<0) return a;
  const rest = a.slice(i+1).trim();
  return /^[(（][\s\S]*[)）]$/.test(rest) ? a.slice(0,i) : a;
}

function buildChoices(c){
  const el = $('choices');
  el.innerHTML = ''; quizLock = false; quizAwaitNext = false;
  let cands;
  if(c.alt){
    cands = [...c.alt];
  }else{
    cands = [...new Set(cards.filter(x=>x.c===c.c && x.a!==c.a && similarType(c.a,x.a)).map(x=>x.a))];
    if(cands.length<3){
      const extra = [...new Set(cards.filter(x=>x.c!=='審査員' && x.a!==c.a && similarType(c.a,x.a)).map(x=>x.a))].filter(a=>!cands.includes(a));
      cands.push(...extra);
    }
    if(cands.length<3){
      const any = [...new Set(cards.filter(x=>x.c!=='審査員' && x.a!==c.a).map(x=>x.a))].filter(a=>!cands.includes(a));
      for(let i=any.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [any[i],any[j]]=[any[j],any[i]];
      }
      cands.push(...any.slice(0, 3-cands.length));
    }
  }
  for(let i=cands.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cands[i],cands[j]]=[cands[j],cands[i]];
  }
  const opts = [c.a, ...cands.slice(0,3)];
  for(let i=opts.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [opts[i],opts[j]]=[opts[j],opts[i]];
  }
  opts.forEach(a=>{
    const b = document.createElement('button');
    b.innerHTML = rubyfy(choiceLabel(a));
    b.dataset.a = a;
    b.addEventListener('click', ()=>answerQuiz(b, a===c.a));
    el.appendChild(b);
  });
  const g = document.createElement('button');
  g.className = 'giveup';
  g.textContent = '🏳️ ギブアップ';
  g.addEventListener('click', ()=>answerQuiz(null, false, true));
  el.appendChild(g);
}

function answerQuiz(btn, ok, gaveUp){
  if(quizLock) return;
  quizLock = true; qTotal++;
  const c = cards[pool[idx]];
  [...$('choices').children].forEach(b=>{ b.disabled = true; });
  if(ok){ qScore++; qStreak++; }
  else{ qStreak = 0; }
  sndShake();
  if(ok){ sndKaboom(2.0); }
  else if(gaveUp){ sndDon(2.0); }
  else { sndZuban(2.0); }
  const cap = ok && qStreak>=2 ? '🔥'+qStreak+'れんぞく!' : '';
  emikuji(ok ? 'せいかい' : (gaveUp ? 'こたえは…' : 'ざんねん…'), ()=>{
    [...$('choices').children].forEach(b=>{
      if(b.dataset.a===c.a) b.classList.add('correct');
    });
    if(!ok && btn) btn.classList.add('wrong');
    quizStatus();
    if(ok){
      $('card').classList.add('flash');
      setTimeout(()=>$('card').classList.remove('flash'), 550);
      if(qStreak>=3){ confetti(qStreak>=5 ? 26 : 14); sndDon(0); }
    }else{
      $('card').classList.add('shake');
      setTimeout(()=>$('card').classList.remove('shake'), 500);
    }
    if(c.panel){
      $('card-text').innerHTML = judgeRevealHTML(c);
      $('card-text').style.fontSize = '';
      $('card-note').innerHTML = '<ruby>審査員<rt>しんさいん</rt></ruby>オープン!';
      const n = c.panel.list.length;
      for(let i=0;i<n-1;i++) sndDon(0.35 + i*0.3 + 0.2);
      sndKaboom(0.35 + (n-1)*0.3 + 0.2);
    }else if(c.votes){
      $('card-text').innerHTML = voteRevealHTML(c.votes);
      $('card-note').textContent = 'とうひょうオープン!';
      const n = c.votes.reduce((s,v)=>s+v.v,0);
      for(let i=0;i<n-1;i++) sndDon(0.4 + i*0.4 + 0.25);
      sndKaboom(0.4 + (n-1)*0.4 + 0.25);
    }else{
      $('card').classList.add('answer');
      $('side-label').textContent = 'こたえ';
      $('card-text').innerHTML = rubyfy(c.a);
      $('card-text').style.fontSize = c.a.length > 60 ? '19px' : '';
      $('card-note').innerHTML = (ok ? 'せいかい! 🎉' : 'こたえは これ!') + (c.note ? '<br>' + rubyfy(c.note) : '');
    }
    showNextButton();
  }, ok ? 'win' : 'lose', cap);
}

function showNextButton(){
  quizAwaitNext = true;
  const b = document.createElement('button');
  b.className = 'next-q';
  b.textContent = 'つぎのもんだいへ →';
  b.addEventListener('click', nextQuiz);
  $('choices').appendChild(b);
}

function nextQuiz(){
  if(!quizAwaitNext) return;
  quizAwaitNext = false;
  idx = (idx+1) % pool.length;
  render();
}

function confetti(n){
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.background = Math.random()<.65 ? 'var(--gold)' : 'var(--red)';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.width = (5+Math.random()*6) + 'px';
    s.style.height = (10+Math.random()*12) + 'px';
    s.style.animationDuration = (1.2+Math.random()*1.3) + 's';
    s.style.animationDelay = (Math.random()*.3) + 's';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 3200);
  }
}

function voteRevealHTML(votes){
  const seq = [];
  votes.forEach(v=>{ for(let i=0;i<v.v;i++) seq.push(v); });
  for(let i=seq.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [seq[i],seq[j]]=[seq[j],seq[i]];
  }
  const li = seq.map(s=>s.w).lastIndexOf(true);
  if(li>=0){ const t=seq[li]; seq.splice(li,1); seq.push(t); }
  let h = '<span class="votes">';
  seq.forEach((s,i)=>{
    h += '<span class="vote-panel'+(s.w?' win':'')+'">'+
         '<span class="vp-inner" style="animation-delay:'+(0.4+i*0.4)+'s">'+
         '<span class="vp-front">?</span>'+
         '<span class="vp-back">'+rubyfy(s.n)+'</span>'+
         '</span></span>';
  });
  h += '</span><span class="votes-sum">'+
    votes.map(v=>(v.w?'👑':'')+rubyfy(v.n)+' '+v.v+'<ruby>票<rt>ひょう</rt></ruby>').join('　')+
    '</span>';
  return h;
}

function judgeRevealHTML(c){
  const list = c.panel.list;
  let h = '<span class="votes">';
  list.forEach((j,i)=>{
    h += '<span class="vote-panel'+(c.hl && j.key===c.hl ? ' win' : '')+'">'+
         '<span class="vp-inner" style="animation-delay:'+(0.35+i*0.3)+'s">'+
         '<span class="vp-front">?</span>'+
         '<span class="vp-back">'+rubyfy(j.full)+'</span>'+
         '</span></span>';
  });
  h += '</span><span class="votes-sum">'+
    c.panel.y+'<ruby>年<rt>ねん</rt></ruby>の<ruby>審査員<rt>しんさいん</rt></ruby> '+list.length+'<ruby>人<rt>にん</rt></ruby>'+
    (c.hl ? '' : '　✖ いなかったのは… <strong style="color:var(--gold);">'+rubyfy(c.a)+'</strong>')+
    '</span>';
  return h;
}

function emikuji(label, done, tone, caption){
  const o = document.createElement('div');
  o.className = 'emikuji-overlay' + (tone ? ' '+tone : '');
  o.innerHTML = '<div class="emi-wrap">'+
    '<div class="emi-stick"><div class="emi-inner">'+
    '<div class="emi-face emi-front"></div>'+
    '<div class="emi-face emi-back">'+rubyfy(label)+'</div>'+
    '</div></div>'+
    '<div class="emi-box"></div>'+
    (caption ? '<div class="emi-caption">'+caption+'</div>' : '')+
    '</div>';
  document.body.appendChild(o);
  setTimeout(()=>{ o.remove(); if(done) done(); }, 3100);
}

function emikujiDraw(){
  if(document.querySelector('.emikuji-overlay')) return;
  sndShake(); sndKaboom(2.0);
  const target = Math.floor(Math.random()*pool.length);
  const c = cards[pool[target]];
  emikuji(catLabels[c.c] || c.c, ()=>{
    idx = target; showAnswer = false; render();
  });
}

function flip(){ if(mode==='uta'||mode==='zukan') return; if(mode==='quiz'){ nextQuiz(); return; } showAnswer = !showAnswer; render(); }
function next(){ if(mode==='uta'||mode==='zukan') return; if(mode==='quiz'&&quizLock) return; idx = (idx+1) % pool.length; showAnswer = false; render(); }
function prev(){ if(mode==='uta'||mode==='zukan') return; if(mode==='quiz'&&quizLock) return; idx = (idx-1+pool.length) % pool.length; showAnswer = false; render(); }
function toggleLearned(){
  const ci = pool[idx];
  if(learned.has(ci)){ learned.delete(ci); }
  else { learned.add(ci); hard.delete(ci); }
  saveLearned(); render();
}
function toggleHard(){
  const ci = pool[idx];
  if(hard.has(ci)){ hard.delete(ci); }
  else { hard.add(ci); learned.delete(ci); }
  saveLearned(); render();
}
function shuffleCards(){
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  idx = 0; showAnswer = false; render();
}
function resetLearned(){
  if(confirm('「おぼえた」と「がんばれ」のきろくをぜんぶけしますか?')){
    learned.clear(); hard.clear(); saveLearned(); render();
  }
}

$('card').addEventListener('click', flip);

let touchX=null, touchY=null;
$('card').addEventListener('touchstart', e=>{
  touchX=e.changedTouches[0].clientX; touchY=e.changedTouches[0].clientY;
},{passive:true});
$('card').addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
  touchX=null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); }
},{passive:true});
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key==='g' || e.key==='G'){ toggleLearned(); }
  else if(e.key==='h' || e.key==='H'){ toggleHard(); }
  else if(e.key==='s' || e.key==='S'){ shuffleCards(); }
});

years.forEach(d=>{ winByYear[d.y] = d.win; });

    '<p class="uta-sub">'+rubyfy('タップで1行[ぎょう]ずつ・▶で頭[あたま]から。太鼓[たいこ]にあわせて声[こえ]に出[だ]すとおぼえられる!')+'</p>'+
    '<button class="uta-play" id="uta-play">▶ うたスタート</button>';
  utaData.forEach(u=>{
    if(u.h){ h += '<p class="uta-head">'+rubyfy(u.h)+'</p>'; return; }
    h += '<div class="uta-line" data-y="'+u.y+'">'+
      '<span class="u-y">'+u.r+'</span>'+
      '<span>'+(u.pre||'')+rubyfy(winByYear[u.y])+

      '</div>';

      l.classList.add('now'); sndDon(0);
      setTimeout(()=>l.classList.remove('now'), 650);
    });
  });
  $('uta-play').addEventListener('click', ()=>{ utaTimer ? utaStop() : utaPlay(); });
})();

let utaTimer = null;
function utaStop(){
  if(utaTimer){ clearInterval(utaTimer); utaTimer = null; }
  const btn = $('uta-play');
  if(btn){ btn.textContent = '▶ うたスタート'; btn.classList.remove('playing'); }
  document.querySelectorAll('.uta-line.now').forEach(l=>l.classList.remove('now'));
}
function utaPlay(){
  const els = [...document.querySelectorAll('#uta .uta-line, #uta .uta-head')].filter(e=>!e.textContent.startsWith('✊'));
  let i = 0;
  actx();
  const btn = $('uta-play');
  btn.textContent = '⏸ とめる'; btn.classList.add('playing');
  const step = ()=>{
    document.querySelectorAll('.uta-line.now').forEach(l=>l.classList.remove('now'));
    if(i >= els.length){ utaStop(); sndKaboom(0); confetti(14); return; }
    const el = els[i];
    if(el.classList.contains('uta-line')){ el.classList.add('now'); sndDon(0); }
    el.scrollIntoView({block:'center', behavior:'smooth'});
    i++;
  };
  step();
  utaTimer = setInterval(step, 1100);
}
