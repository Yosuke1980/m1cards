button,.card{touch-action:manipulation;}
body{

  padding:32px 16px 64px;
}
header{width:100%;max-width:740px;margin-bottom:14px;}
.eyebrow{font-size:12px;letter-spacing:0.3em;color:var(--gold);font-weight:700;margin-bottom:6px;}
h1{font-size:24px;font-weight:900;border-left:6px solid var(--red);padding-left:14px;line-height:1.6;}
.nav{width:100%;max-width:740px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.nav a,.nav span{
  font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;white-space:nowrap;
}
.nav span{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700;}
.mode-toggle{width:100%;max-width:740px;display:flex;gap:8px;margin-bottom:12px;}
.mode-toggle button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;}
.mode-toggle button.active{background:var(--gold);border-color:var(--gold);color:#1a1408;}
.tables,.reward{display:none;width:100%;max-width:740px;}
body.hyo-mode .tables{display:block;}
body.reward-mode .reward{display:block;}
body.hyo-mode .card,body.hyo-mode .choices,body.hyo-mode .filters,body.hyo-mode .status,
body.reward-mode .card,body.reward-mode .choices,body.reward-mode .filters,body.reward-mode .status{display:none;}

.hyo-row{display:flex;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.9;align-items:baseline;}
.hyo-row:last-child{border-bottom:none;}
.hyo-row .hq{color:var(--text-dim);text-align:left;}
.hyo-row .ha{font-weight:900;color:var(--gold);text-align:right;white-space:nowrap;flex-shrink:0;cursor:default;}
.hyo-row .ha[data-say]{cursor:pointer;}
.filters{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:740px;margin-bottom:10px;}
.filters button{
  font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;
  background:var(--panel);color:var(--text-dim);border:1px solid var(--line);border-radius:999px;cursor:pointer;

.filters button.active{background:var(--red);border-color:var(--red);color:#fff;}
.status{
  width:100%;max-width:740px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:13px;color:var(--text-dim);
}
.status .score{color:var(--gold);font-weight:700;}
.status .snd{font-family:inherit;font-size:14px;padding:4px 9px;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;}
.status a{color:var(--gold);font-weight:700;text-decoration:none;margin-right:8px;}
.card{
  width:100%;max-width:740px;min-height:190px;
  background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:36px 24px;position:relative;user-select:none;
  box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);

.card.flash{animation:flashGold .5s;}
@keyframes flashGold{
  0%{box-shadow:0 0 0 3px var(--gold), 0 0 70px rgba(217,164,65,.85);}
  100%{box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);}
}
.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}80%{transform:translateX(5px);}

.badge{

.choices{width:100%;max-width:740px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}

<script>
// ---- サウンド（さんすうカードと同じ自作効果音・外部音源なし） ----
let sndOn = true;
try{ sndOn = localStorage.getItem('kokugo-sound') !== 'off'; }catch(e){}
let ac = null;
function actx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!ac) ac = new AC();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function envGain(g, t0, peak, dur){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
}
function noiseBuf(){
  if(noiseBuf.b) return noiseBuf.b;
  const c = actx(), b = c.createBuffer(1, c.sampleRate*0.5, c.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf.b = b;
}
let masterNode = null;
function makeIR(dur, decay){
  const c = actx(), len = Math.floor(c.sampleRate*dur);
  const b = c.createBuffer(2, len, c.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = b.getChannelData(ch);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
  }
  return b;
}
function master(){
  const c = actx();
  if(!masterNode){
    const inp = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 6;
    comp.connect(c.destination);
    inp.connect(comp);
    const conv = c.createConvolver(); conv.buffer = makeIR(1.8, 2.5);
    const wet = c.createGain(); wet.gain.value = 0.35;
    inp.connect(conv); conv.connect(wet); wet.connect(comp);
    masterNode = inp;
  }
  return masterNode;
}
function playNoise(t0, dur, freq, peak){
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function tone(t0, freq, dur, type, peak, slideTo){
  const c = actx();
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  const g = c.createGain(); envGain(g, t0, peak, dur);
  o.connect(g); g.connect(master());
  o.start(t0); o.stop(t0+dur+0.05);
}
function sndCrash(t0, dur, peak){
  const c = actx();
  const s = c.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
  const g = c.createGain(); envGain(g, t0, peak, dur);
  s.connect(f); f.connect(g); g.connect(master());
  s.start(t0); s.stop(t0+dur+0.05);
}
function sndKaboom(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 90, 0.8, 'sine', 0.9, 28);
  playNoise(t0, 0.25, 250, 0.5);
  sndCrash(t0, 1.4, 0.3);
}
function sndZuban(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 500, 0.45, 'sawtooth', 0.3, 60);
  tone(t0+0.05, 70, 0.6, 'sine', 0.6, 30);
}
function sndDon(){
  if(!sndOn) return;
  const t0 = actx().currentTime;
  tone(t0, 82, 0.55, 'sine', 0.7, 32);
  playNoise(t0, 0.12, 180, 0.25);
}
const sndBtn = document.getElementById('snd-btn');
function updSndBtn(){ sndBtn.textContent = sndOn ? '🔊' : '🔇'; }
sndBtn.addEventListener('click', ()=>{
  sndOn = !sndOn;
  try{ localStorage.setItem('kokugo-sound', sndOn ? 'on' : 'off'); }catch(e){}
  if(sndOn){ actx(); sndDon(); }
  updSndBtn();
});
updSndBtn();

const HARD_CATS = ["かんようく", "おなじおと", "しりとり", "おとのかず", "ことばのきまり", "ことわざ", "けいご", "はんたいことば⁺"];
function isHard(c){ return HARD_CATS.includes(c.c); }

const $ = id => document.getElementById(id);
let cat = 'all';
let pool = [], idx = 0, qNo = 0, score = 0, streak = 0;
let cur = null, locked = false;

let againPool = [];
try{
  const s = localStorage.getItem('kokugo-again');
  if(s) againPool = JSON.parse(s);
}catch(e){}
function saveAgain(){ try{ localStorage.setItem('kokugo-again', JSON.stringify(againPool.slice(0,60))); }catch(e){} }

function buildPool(){
  pool = DECK.map((_,i)=>i).filter(i => cat==='all' || DECK[i].c===cat);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  idx = 0;
}

function pick(){
  const solved = i => GOHOUBI.solvedToday && GOHOUBI.solvedToday('kokugo', i);
  if(againPool.length && Math.random() < 0.35){
    const cand = againPool.filter(i => (cat==='all' || DECK[i].c===cat) && !solved(i));
    if(cand.length) return {i:cand[Math.floor(Math.random()*cand.length)], again:true};
  }
  // 今日まだ正解していない問題だけを出す（同じ問題を何度も見せない）
  for(let n=0; n<pool.length; n++){
    const i = pool[idx % pool.length];
    idx++;
    if(!solved(i)) return {i, again:false};
  }
  return null;   // このカテゴリは今日ぶん終わり
}

function ghMini(){ $('gh-mini').textContent = GOHOUBI.mini('kokugo'); }

function render(){
  const p = pick();
  if(!p){
    $('q-text').innerHTML = '<span class="pic">🎉</span>きょうの ぶんは ぜんぶ せいかいしたよ！';
    $('card-note').innerHTML = 'ほかの きょうかを やってみよう。あしたに なると また あそべるよ';
    $('choices').innerHTML = '';
    $('cat-badge').textContent = 'かんりょう';
    ghMini();
    return;
  }
  cur = {...DECK[p.i], i:p.i, again:p.again};
  locked = false; qNo++;
  $('counter').textContent = 'もんだい ' + qNo;
  $('score').innerHTML = 'せいかい ' + score + ' / ' + (qNo-1) +
    (streak>=2 ? '　<span style="color:#f0857c;">🔥' + streak + 'れんぞく</span>' : '');
  ghMini();
  $('cat-badge').textContent = cur.c;
  $('q-text').innerHTML = cur.q;
  $('card-note').innerHTML = (GOHOUBI.isCapped||(()=>false))('kokugo')
    ? 'この きょうかの ⭐は まんタン🈵 ほかの きょうかで あつめよう！'
    : ('したの4つからえらんでね');
  $('card').classList.toggle('is-again', cur.again);
  const opts = [cur.a, ...cur.alt];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const el = $('choices');
  el.innerHTML = '';
  opts.forEach(v=>{
    const b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', ()=>answer(b, v===cur.a));
    el.appendChild(b);
  });
}

function confetti(n){
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.style.cssText = 'position:fixed;top:-16px;z-index:30;pointer-events:none;border-radius:2px;';
    s.style.background = Math.random()<.65 ? 'var(--gold)' : 'var(--red)';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.width = (5+Math.random()*6) + 'px';
    s.style.height = (10+Math.random()*12) + 'px';
    s.style.animation = 'ghFall ' + (1.2+Math.random()*1.3) + 's linear ' + (Math.random()*.3) + 's forwards';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 3200);
  }
}

function answer(btn, ok){
  if(locked) return;
  locked = true;
  [...$('choices').children].forEach(b=>{
    b.disabled = true;
    if(b.textContent === cur.a) b.classList.add('correct');
  });
  if(ok){
    score++; streak++;
    sndKaboom();
    $('card').classList.add('flash');
    setTimeout(()=>$('card').classList.remove('flash'), 550);
    $('card-note').textContent = streak>=3 ? '🔥 ' + streak + 'れんぞくせいかい！' : 'せいかい！🎉';
    const st = GOHOUBI.state();
    if(streak>=3){ confetti(streak>=5 ? 26 : 14); sndDon(); }
    const ai = againPool.indexOf(cur.i);
    if(ai>=0){ againPool.splice(ai,1); saveAgain(); }
    const res = GOHOUBI.award(()=>{ ghMini(); render(); }, 800, 'kokugo', cur.i, isHard(cur));
    ghMini();
    if(res.stamped) $('card-note').innerHTML =
      (res.hard ? '🔥 むずかしい問題 せいかい！<br>' : 'せいかい！🎉<br>') +
      '<span style="color:var(--gold);font-weight:900;">⭐ スタンプ ゲット！ ' + GOHOUBI.state().s + '/10</span>';
    else if(res.repeat) $('card-note').innerHTML = 'きょう もう せいかいした もんだいだよ😊<br>⭐は ふえないけど れんしゅうに なるよ';
    else if(res.capped) $('card-note').innerHTML = 'せいかい！でも この きょうかの ⭐は まんタン！<br>ほかの きょうかも やって あつめよう🎒';
    if(!res.shown) setTimeout(render, 950);
  }else{
    streak = 0;
    GOHOUBI.miss(); ghMini();
    sndZuban();
    if(btn) btn.classList.add('wrong');
    $('card').classList.add('shake');
    setTimeout(()=>$('card').classList.remove('shake'), 500);
    $('card-note').innerHTML = 'こたえは <span class="ans">' + cur.a + '</span>！⭐が1こ へったよ。あとでもういっかい出すね💪';
    if(!againPool.includes(cur.i)){ againPool.unshift(cur.i); saveAgain(); }
    const b = document.createElement('button');
    b.className = 'next-q';
    b.textContent = 'つぎのもんだいへ →';
    b.addEventListener('click', render);
    $('choices').appendChild(b);
  }
}

document.querySelectorAll('#cat-filters button').forEach(b=>{
  b.addEventListener('click', ()=>{
    cat = b.dataset.c;
    document.querySelectorAll('#cat-filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    buildPool(); render();
  });
});

buildPool();
render();

// ---- モード切替（クイズ/ひょう/ごほうび） ----
document.querySelectorAll('.mode-toggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-toggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.classList.toggle('hyo-mode', b.dataset.m==='hyo');
    document.body.classList.toggle('reward-mode', b.dataset.m==='reward');
    if(b.dataset.m==='reward') (GOHOUBI.renderPanel||(()=>{}))(document.getElementById('reward'));
  });
});

// ---- ひょう（こたえの一覧表） ----
(function buildHyo(){
  const el = document.getElementById('hyo');
  const cats = [];
  DECK.forEach(d=>{ if(!cats.includes(d.c)) cats.push(d.c); });
  let h = '';
  cats.forEach(c=>{
    h += '<div class="tbl-panel"><p class="tbl-title">\uD83D\uDCD6 '+c+'</p>';
    DECK.filter(d=>d.c===c).forEach(d=>{
      const q = d.q.replace(/<span class="pic">[\s\S]*?<\/span>/,'').replace(/<br>[\s\S]*$/,'').replace(/<[^>]+>/g,'');
      h += '<div class="hyo-row"><span class="hq">'+q+'</span>' + '<span class="ha">'+d.a+'</span>' + '</div>';
    });
    h += '</div>';
  });
  el.innerHTML = h;
})();
