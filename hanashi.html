<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#111013; --panel:#1c1a1f; --panel-2:#242127; --line:#38343d;
  --red:#d1352b; --red-deep:#8f1f18; --gold:#d9a441; --text:#f2efe9; --text-dim:#a49e94;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,.card{touch-action:manipulation;}
body{
  background:
    radial-gradient(ellipse 90% 55% at 50% -10%, rgba(209,53,43,.20), transparent 60%),
    radial-gradient(ellipse 45% 35% at 15% 110%, rgba(217,164,65,.10), transparent 60%),
    radial-gradient(ellipse 45% 35% at 85% 110%, rgba(217,164,65,.10), transparent 60%),
    var(--bg);
  color:var(--text); font-family:"Zen Maru Gothic",sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:32px 16px 64px;
}
header{width:100%;max-width:740px;margin-bottom:14px;}
.eyebrow{font-size:12px;letter-spacing:0.3em;color:var(--gold);font-weight:700;margin-bottom:6px;}
h1{font-size:24px;font-weight:900;border-left:6px solid var(--red);padding-left:14px;line-height:1.6;}
.nav{width:100%;max-width:740px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.nav a,.nav span{
  font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;white-space:nowrap;
}
.nav span{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700;}
.mode-toggle{width:100%;max-width:740px;display:flex;gap:8px;margin-bottom:12px;}
.mode-toggle button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;}
.mode-toggle button.active{background:var(--gold);border-color:var(--gold);color:#1a1408;}
.tables,.reward{display:none;width:100%;max-width:740px;}
body.hyo-mode .tables{display:block;}
body.reward-mode .reward{display:block;}
body.hyo-mode .card,body.hyo-mode .choices,body.hyo-mode .filters,body.hyo-mode .status,
body.reward-mode .card,body.reward-mode .choices,body.reward-mode .filters,body.reward-mode .status{display:none;}
.tbl-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(217,164,65,.28);}
.tbl-title{font-size:16px;font-weight:900;color:var(--gold);margin-bottom:8px;}
.hyo-row{display:flex;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.9;align-items:baseline;}
.hyo-row:last-child{border-bottom:none;}
.hyo-row .hq{color:var(--text-dim);text-align:left;}
.hyo-row .ha{font-weight:900;color:var(--gold);text-align:right;white-space:nowrap;flex-shrink:0;cursor:default;}
.hyo-row .ha[data-say]{cursor:pointer;}
.status{
  width:100%;max-width:740px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:13px;color:var(--text-dim);
}
.status .score{color:var(--gold);font-weight:700;}
.status a{color:var(--gold);font-weight:700;text-decoration:none;}
.card{
  width:100%;max-width:740px;min-height:230px;
  background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:36px 24px;position:relative;user-select:none;
  box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);
}
.card.flash{animation:flashGold .5s;}
@keyframes flashGold{
  0%{box-shadow:0 0 0 3px var(--gold), 0 0 70px rgba(217,164,65,.85);}
  100%{box-shadow:0 0 0 1px rgba(217,164,65,.28), 0 14px 44px rgba(0,0,0,.5);}
}
.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}80%{transform:translateX(5px);}
}
.badge{
  position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;
  padding:4px 12px;border-radius:4px;background:var(--red-deep);color:#fff;
}
.q-text{font-size:30px;font-weight:900;line-height:1.8;}
.q-text .pic{font-size:60px;display:block;margin-bottom:8px;line-height:1.3;}
.card-note{font-size:13px;color:var(--text-dim);margin-top:14px;line-height:1.9;}
.card-note .ans{color:var(--gold);font-weight:900;font-size:20px;}
.listen-btn{
  font-family:inherit;font-size:22px;font-weight:900;padding:20px 44px;border-radius:999px;
  border:none;background:var(--red);color:#fff;cursor:pointer;margin-top:14px;
  box-shadow:0 6px 22px rgba(209,53,43,.45);
}
.listen-btn:disabled{opacity:.5;cursor:default;}
.replay{
  font-family:inherit;font-size:12px;font-weight:700;padding:8px 16px;border-radius:999px;
  border:1px dashed var(--line);background:transparent;color:var(--text-dim);cursor:pointer;margin-top:12px;
}
.speaking{animation:pulse 1.1s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.choices{width:100%;max-width:740px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.choices button{
  font-family:inherit;font-size:20px;font-weight:900;line-height:1.7;padding:16px 14px;border-radius:8px;
  border:1px solid var(--line);border-left:5px solid var(--gold);
  background:linear-gradient(180deg,#242127,#191619);color:var(--text);cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
@media (hover:hover){.choices button:hover:not(:disabled){border-color:var(--red);}}
.choices button.correct{background:#2f7d4a;border-color:#2f7d4a;color:#fff;}
.choices button.wrong{background:var(--red-deep);border-color:var(--red-deep);color:#fff;}
.choices button:disabled{cursor:default;}
.choices button.next-q{
  grid-column:1/-1;font-size:16px;font-weight:700;padding:14px;
  border-color:var(--red);border-left:5px solid var(--red);background:var(--red);color:#fff;
}
@media (max-width:560px){
  body{padding:12px 12px 40px;}
  h1{font-size:18px;}
  .q-text{font-size:24px;}
  .choices button{font-size:17px;padding:13px 10px;}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

// ---- 音声（日本語読み上げ） ----
let jaVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>v.lang==='ja-JP' && v.name.includes('Kyoko')) ||
            vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang.startsWith('ja')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let jaBank = {};
fetch('audio/ja/manifest.json').then(r=>r.json()).then(m=>{ jaBank = m; }).catch(()=>{});
let curAudio = null;
function stopAudio(){
  if(curAudio){ curAudio.onended = null; curAudio.pause(); curAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function readAloud(t){ return t.replace(/M-1/g, 'エムワン'); }  // 「えむいち」と読まれるのを防ぐ
function speakTTS(text, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  const u = new SpeechSynthesisUtterance(readAloud(text));
  u.lang = 'ja-JP';
  if(jaVoice) u.voice = jaVoice;
  u.rate = 0.9;
  if(onEnd) u.onend = onEnd;
  speechSynthesis.speak(u);
}
function speak(text, onEnd){
  stopAudio();
  if(jaBank[text]){
    curAudio = new Audio('audio/ja/' + jaBank[text]);
    if(onEnd) curAudio.onended = onEnd;
    curAudio.play().catch(()=>{ speakTTS(text, onEnd); });
    return;
  }
  speakTTS(text, onEnd);
}

// ---- すすめかた ----
const $ = id => document.getElementById(id);
let order = STORIES.map((_,i)=>i);
for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
let sIdx = 0, qIdx = 0, sScore = 0;
let score = 0, total = 0, locked = false;

function ghMini(){ $('gh-mini').textContent = GOHOUBI.mini('hanashi'); }

function story(){ return STORIES[order[sIdx % order.length]]; }

function storyDone(si){
  // その話の設問を今日ぜんぶ正解ずみか
  const s = STORIES[order[si % order.length]];
  if(!GOHOUBI.solvedToday) return false;
  return s.qs.every((_, qi) => GOHOUBI.solvedToday('hanashi', (order[si % order.length]) + '-' + qi));
}

function skipDoneStories(){
  for(let n = 0; n < order.length; n++){
    if(!storyDone(sIdx)) return true;
    sIdx++;
  }
  return false;   // ぜんぶ終わった
}

function showListen(){
  if(!skipDoneStories()){
    $('badge').textContent = 'かんりょう';
    $('q-text').innerHTML = '<span class="pic">🎉</span>きょうの おはなしは ぜんぶ せいかいしたよ！';
    $('card-note').textContent = 'ほかの きょうかを やってみよう。あしたに なると また あそべるよ';
    $('listen-btn').style.display = 'none';
    $('replay-btn').style.display = 'none';
    $('choices').innerHTML = '';
    ghMini();
    return;
  }
  const s = story();
  qIdx = 0; sScore = 0;
  $('counter').textContent = 'おはなし ' + (sIdx+1);
  $('score').innerHTML = 'せいかい ' + score + ' / ' + total;
  ghMini();
  $('badge').textContent = 'きく';
  $('q-text').innerHTML = '<span class="pic">' + s.pic + '</span>' + s.title;
  $('card-note').textContent = 'ボタンをおして、よーく きいてね。おはなしは がめんに でないよ！';
  $('listen-btn').style.display = '';
  $('listen-btn').disabled = false;
  $('replay-btn').style.display = 'none';
  $('choices').innerHTML = '';
}

function listen(){
  const s = story();
  $('listen-btn').disabled = true;
  $('listen-btn').classList.add('speaking');
  $('card-note').textContent = '👂 きいてるところ…';
  speak(s.text, ()=>{
    $('listen-btn').classList.remove('speaking');
    showQuestion();
  });
}

function showQuestion(){
  const s = story();
  const q = s.qs[qIdx];
  locked = false;
  $('badge').textContent = 'もんだい ' + (qIdx+1) + ' / ' + s.qs.length;
  $('q-text').innerHTML = '<span class="pic">' + s.pic + '</span>' + q.q;
  $('card-note').textContent = 'おもいだして えらんでね';
  $('listen-btn').style.display = 'none';
  $('replay-btn').style.display = '';
  const opts = [q.a, ...q.alt];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const el = $('choices');
  el.innerHTML = '';
  opts.forEach(v=>{
    const b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', ()=>answer(b, v===q.a));
    el.appendChild(b);
  });
  speak(q.q);
}

function confettiN(n){
  for(let i=0;i<n;i++){
    const sp = document.createElement('span');
    sp.style.cssText = 'position:fixed;top:-16px;z-index:30;pointer-events:none;border-radius:2px;';
    sp.style.background = Math.random()<.65 ? 'var(--gold)' : 'var(--red)';
    sp.style.left = (Math.random()*100) + 'vw';
    sp.style.width = (5+Math.random()*6) + 'px';
    sp.style.height = (10+Math.random()*12) + 'px';
    sp.style.animation = 'ghFall ' + (1.2+Math.random()*1.3) + 's linear ' + (Math.random()*.3) + 's forwards';
    document.body.appendChild(sp);
    setTimeout(()=>sp.remove(), 3200);
  }
}

function answer(btn, ok){
  if(locked) return;
  locked = true; total++;
  const s = story();
  const q = s.qs[qIdx];
  [...$('choices').children].forEach(b=>{
    b.disabled = true;
    if(b.textContent === q.a) b.classList.add('correct');
  });
  if(ok){
    score++; sScore++;
    $('card').classList.add('flash');
    setTimeout(()=>$('card').classList.remove('flash'), 550);
    $('card-note').textContent = 'せいかい！🎉';
    const res = GOHOUBI.award(()=>{ ghMini(); nextQ(); }, 700, 'hanashi', (order[sIdx % order.length])+'-'+qIdx);
    ghMini();
    if(res.stamped) $('card-note').innerHTML =
      'せいかい！🎉<br><span style="color:var(--gold);font-weight:900;">⭐ スタンプ ゲット！ '
      + GOHOUBI.state().s + '/10</span>';
    else if(res.repeat) $('card-note').innerHTML = 'きょう もう せいかいした もんだいだよ😊<br>⭐は ふえないけど れんしゅうに なるよ';
    else if(res.capped) $('card-note').innerHTML = 'せいかい！でも この きょうかの ⭐は まんタン！<br>ほかの きょうかも やって あつめよう🎒';
    if(!res.shown) setTimeout(nextQ, 900);
  }else{
    GOHOUBI.miss(); ghMini();
    if(btn) btn.classList.add('wrong');
    $('card').classList.add('shake');
    setTimeout(()=>$('card').classList.remove('shake'), 500);
    $('card-note').innerHTML = 'こたえは <span class="ans">' + q.a + '</span>！⭐が1こ へったよ💪';
    const b = document.createElement('button');
    b.className = 'next-q';
    b.textContent = 'つぎへ →';
    b.addEventListener('click', nextQ);
    $('choices').appendChild(b);
  }
}

function nextQ(){
  const s = story();
  qIdx++;
  if(qIdx < s.qs.length){ showQuestion(); return; }
  // おはなし1本おわり
  $('badge').textContent = 'けっか';
  $('q-text').innerHTML = '<span class="pic">' + (sScore===s.qs.length ? '👑' : '⭕') + '</span>' +
    s.qs.length + 'もん中 ' + sScore + 'もん せいかい！';
  $('card-note').textContent = sScore===s.qs.length ? 'ぜんもんせいかい！すごい！' : 'つぎの おはなしも がんばろう';
  if(sScore===s.qs.length) confettiN(20);
  $('replay-btn').style.display = 'none';
  const el = $('choices');
  el.innerHTML = '';
  const b = document.createElement('button');
  b.className = 'next-q';
  b.textContent = 'つぎの おはなしへ →';
  b.addEventListener('click', ()=>{ sIdx++; showListen(); });
  el.appendChild(b);
}

$('listen-btn').addEventListener('click', listen);
$('replay-btn').addEventListener('click', ()=>{ const s = story(); speak(s.text); });

showListen();

// ---- モード切替 ----
document.querySelectorAll('.mode-toggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-toggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.classList.toggle('hyo-mode', b.dataset.m==='hyo');
    document.body.classList.toggle('reward-mode', b.dataset.m==='reward');
    if(b.dataset.m!=='quiz') stopAudio();
    if(b.dataset.m==='reward') (GOHOUBI.renderPanel||(()=>{}))(document.getElementById('reward'));
  });
});

  const el = document.getElementById('hyo');
  let h = '';
  STORIES.forEach(s=>{
    h += '<div class="tbl-panel"><p class="tbl-title">'+s.pic+' '+s.title+'</p>'+
      '<p style="font-size:15px;line-height:2.2;color:var(--text);">'+s.text+'</p></div>';
  });
  el.innerHTML = h;
})();
